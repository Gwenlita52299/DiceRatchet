# configs/default.yaml —— MOD-09 配置合并的基座（Spec §5 / B-26）
# 优先级：CLI 参数 > DICERATCHET_* 环境变量 > harness/config.json > 本文件 > 代码默认值
# 键路径与 dice_ratchet/infra/config.py 的 AppConfig 一一对应（见该文件 docstring 的映射表）。
# 浮点精度：report.json / metrics 一律 round(x,4)（Spec §4.5 B-34）。

# ============ env（MOD-01 环境规则 + MOD-02 沙箱 + 局配置）============
# 2026-10-14（Spec B-88，F77-a/b/c）：env.content_dir / env.golden_dir /
# env.check_invariants 三个键已删除（全库 0 消费者）。配表目录的权威是 MOD-01 的
# GAME_CONTENT_DIR（import 时解析 DICERATCHET_ENV__CONTENT_DIR，见 loader.py），
# 不再由配置声明；`audit leak` 改用 run 快照的 content_hash **反查**真实配表，
# 对不上就判 critical 并降级 future_room/shop 规则集（见 sandbox/audit.py）。
env:
  episode: # 默认局（Spec §8.6）：hard × 6 关，greedy_counter 通关率 45.5%（n=200，seed 1–200；复现命令见 Spec §8.6）
    # 2026-10-06（M2 开工 D-2 裁决）：默认局**保持 hard × 6**（M3 主口径），本值不动。
    # M2 的闭环联调与 §3.2 冒烟改用 run 级 override 的 medium × 6 bring-up 口径：
    #   DICERATCHET_ENV__EPISODE__DIFFICULTY=medium <cmd>      # B-30：__ 分层，等价于 env.episode.difficulty
    # （stage_count 保持 6、toggles 全开；M1 的 CLI 没有通用 --set，只有 --k/--generations/--hitl/
    #   --model/--mode/--seed/--timeout-ms/--log-level 这 8 个显式覆盖键。）
    # hard × 6 的 fixed_prompt 基线 win_rate = 0.0%，win_rate 无方差、无法判定演化，
    # 先跑 medium × 6 把闭环跑通，再回到 hard × 6。medium × 6 的基线与 D 需实测登记（Spec §8.6）。
    # 注意：difficulty 参与 config_hash（实测 hard→141bef5f…、medium→2dc294eb…），
    # 因此 medium 口径属另一个 run-id 族（F10），不会与 hard 基线的归档混淆。
    difficulty: hard
    stage_count: 6
    character: warrior
    # 开启清单：列出为开、未列出为关。名字必须与 GAME 内核 TOGGLE_KEYS 完全一致
    # （mapBranching/relics/events/shops/schoolCounter），否则 SandboxEnv 报
    # E_ENV_CONFIG_INVALID（fail-closed；M0 验收 F1：曾误写 forge/shop/shrines/blessings）。
    toggles: [mapBranching, relics, events, shops, schoolCounter]
    max_env_steps: 1000 # env 步硬上限（唯一键，各模块只读）
    max_decisions: 300 # 决策点上限
  sandbox: # MOD-02
    # 2026-10-14（Spec B-86/B-87，F73/F75）：本子树原有 15 个键，实测只有 2 个有消费者。
    # 清掉的 13 个 + 理由（逐键见 infra/config.py::SandboxConfig 的类注释）：
    #  · guard.enforce / scan_roots / process_boundary —— warn 档会削弱 INV-4；
    #    scan_roots 是 INV-1 的分层结构（权威 guard.py::ENV_ROOTS）；process_boundary
    #    指向的 run_agent_tick() 无生产调用点（工具边界在 ToolWorker 上）。
    #  · honeypot.enabled / plan_path / self_test —— 注入是检测不变式 G4；plan 文件
    #    configs/honeypot.yaml 是测试用的契约夹具；self_test 的旋钮在 CLI。
    #  · projection.mode / projection.schema_version —— assert 是测试档（golden 显式传）；
    #    协议版本必须是代码常量（FR-02-5 的 CI 校验），不可被配置伪造。
    #  · render.max_tokens_p95 —— render_compact() 不收预算参数、全库无断言读它。
    #  · exec.timeout_s / mem_limit_mb / cpu_limit_s / max_tools —— ToolWorker 的
    #    containment 参数（INV-4），权威在 guard.py 的默认参数，由用例钉住数值。
    policy_failure_streak: 3
    audit:
      # 规则集版本**钉扎**（Spec B-86，2026-10-14）：必须与代码常量
      # dice_ratchet/sandbox/audit.py::RULESET_VERSION 一致，否则 `audit leak` fail-closed
      # （E_ENV_AUDIT_RULESET，退出码 4）。审计的触发方式是显式 CLI，不存在「每代自动审计」；
      # 旧的 enabled/surfaces/fail_on/evidence_chars 四键已删除（全库 0 消费者）。
      ruleset_pin: 1.1.0

# ============ agent（MOD-04 决策策略；policy.* 为 harness 可演化白名单）============
agent:
  policy:
    mode: play
    template_path: harness/prompts/decision.md
    # 2026-10-05（M1 验收 F12）：原值指向 harness/prompts/{fixed_v1,task}.md，那两个文件
    # 不存在——`policy.py` 靠包内回落兜住并静默，于是「改配置」根本不影响实际 prompt。
    # 二者都是随包冻结件（R-6：基线模板不随 harness 演化），所以直接指向真实位置。
    fixed_prompt_path: dice_ratchet/agent/prompts/fixed_v1.md
    task_path: dice_ratchet/agent/prompts/task.md
    prompt_token_budget: 3072
    token_estimator: chars_div_3
    memory_top_k: 5
    reflection_max: 3
    retry_max: 2
    illegal_streak_limit: 3
    illegal_penalty: -0.05
    temperature: 0.7 # 训练探索温度（运行期 clamp 0.7–1.2）；评估温度固定 0.0（B-14，无配置键）
    top_p: 0.95
    max_tokens: 320
    max_plan_len: 12
    tool_timeout_ms: 50
    tools_enabled: true
    heuristic_fallback: true
    reasoning_max_chars: 400
    sampling_seed_salt: policy-v1
    leak_scan: true # 恒 true
  tools: {}

# ============ inference（MOD-03 推理后端）============
inference:
  registry_path: configs/models.yaml
  model_id: qwen3-8b-q4 # 阶段二切 qwen3-30b-a3b-q4
  mode: train
  backend: mlx
  fallback_backend: mock
  ram_budget_gb: 20.0
  max_attempts: 3
  retry_backoff_ms: 200
  # 2026-10-04（M1 实测回填）：原 8000 ms 是按「预估 t_d ≈ 3 s」定的。真实 8B 在默认局
  # prompt（预填 p50 = 2134 token）上实测 t_d p50 = 5.69 s / p95 = 11.70 s，一次调用最多
  # 重试 3 次；8000 ms 会把正常决策判成 E_LLM_TIMEOUT（首次实测即触发）。
  # 取 120 s ≈ 实测 p95 × 3 次尝试 × 3.4 倍余量（依据见 MOD-03 PRD Q-2、M1 验收报告 §12）。
  total_timeout_ms: 120000
  generate_timeout_ms: 30000
  # 2026-10-09（F37 登记，**结论：本键不能抬**）：它同时是「调用方未显式指定时的模态
  # 默认」，MOD-07 的**提案**（harness 补丁：diff + rationale）也走它，而 256 只够决策点
  # （实测提案需 ~500 completion token，256 时一律 `finish_reason=length` 截断 → 被报成
  # `E_LLM_SCHEMA_INVALID` → proposer 永远 0 候选 → 闭环静默定格）。
  # **但全局抬高会打断小窗口模型**：`guard_context`（FR-03-10）按
  # `est_prompt + max_tokens ≤ context_length` 判定，2048 时 `mock`（4096）实测
  # 71 例 `E_LLM_CONTEXT_OVERFLOW`（2052+2048 > 4096），并吃掉 8B（8192）臂的余量。
  # ⇒ F37 的正确修法是**按调用方给输出预算**（提案单独给大预算），不是改本键。
  max_tokens: 256
  reasoning_max_tokens: 160
  context_overflow_policy: reject
  train_temperature_min: 0.7
  seed: null # 评估模式必须非空（由 MOD-09 seed 注册表传入）
  cache_prompt: true
  kv_cache_bits: 4
  max_inflight: 4 # 评估模式强制 1
  debug_dump_raw: false
  skip_hash_check: false
  llama_server_startup_timeout_ms: 60000
  llama_server_port: 0
  # ---- API provider（deepseek 等在线后端；Issue #1「DeepSeek API 适配要求」）--------
  # live 真调 API；replay 只从 api_replay_dir 读历史响应（复现/调试，不得冒充新样本）。
  # Qwen 主线与这两项无关，始终可完全离线运行。
  api_mode: live
  api_replay_dir: "" # api_mode=replay 时必须非空
  api_record_dir: llm_api # 相对 run 目录：请求/响应 hash、usage、成本（不含 key）
  api_record_enabled: true
  api_connect_timeout_ms: 10000
  api_max_retries: 2 # 传输层有限重试（429/5xx/超时）；schema 修复重试仍归 MOD-03 三级策略
  # API key 的本地便利文件（默认仓库根的 .env，已被 .gitignore 忽略，绝不入库）。
  # 真实环境变量优先；文件里除注册表声明的 key 名（如 DEEPSEEK_API_KEY）以外的行不生效。
  # 用法：cp .env.example .env && chmod 600 .env，然后把 key 粘进去。空字符串 = 关闭。
  api_key_file: .env

# ============ models（MOD-03 模型角色绑定；Issue #1 §2）============
# 角色：policy（游戏决策）/ reflection（局末反思）/ proposer（harness 修改提案）。
# 空字符串 = 继承 inference.model_id。这条继承规则让 CLI `--model`（写的是
# inference.model_id）仍然一次覆盖全部角色（`--model mock` 的离线冒烟语义不变）；
# 显式写了角色键就是明确的绑定意图，优先于 `--model`。
# 三个角色都必须经 MOD-03 的统一 InferenceClient 取模型；MOD-04/06/07/08 不得直接
# import MLX / llama.cpp / DeepSeek SDK / HTTP 客户端（guards check 静态强制）。
models:
  policy: "" # 空 = 用 inference.model_id（默认 qwen3-8b-q4）
  reflection: "" # 空 = 同上
  proposer: "" # 空 = 同上；B/C 臂经 experiment.arms 钉到 deepseek-flash
  # 例：把 proposer 单独钉到 DeepSeek，决策/反思保持本地 8B（等价于臂 B0/B1）：
  #   proposer: deepseek-flash

# ============ experiment（实验臂；Issue #1 §1）============
# 臂是**差分**：只描述相对 models 段的覆盖。优先级（高 → 低）：
#   experiment.roles.<role> > experiment.arms[arm].<role> > models.<role> > inference.model_id
# harness 只做登记（fixed / evolve），本轮不改 MOD-06 的演化开关（Issue #1 任务 6）。
# 臂定义计入 config_hash → 换臂即换 run-id 族（F10），六个臂的产物不会互相污染。
# arm="" 表示不选臂，只用 models / inference.model_id 绑定（冒烟与自定义对照用）。
experiment:
  arm: A1
  roles: {} # 手工覆盖，优先级最高（例：{proposer: deepseek-flash}）
  arms:
    A0: {policy: "", reflection: "", proposer: "", harness: fixed}
    A1: {policy: "", reflection: "", proposer: "", harness: evolve}
    B0: {policy: "", reflection: "", proposer: deepseek-flash, harness: fixed}
    B1: {policy: "", reflection: "", proposer: deepseek-flash, harness: evolve}
    C0: {policy: deepseek-flash, reflection: deepseek-flash, proposer: deepseek-flash, harness: fixed}
    C1: {policy: deepseek-flash, reflection: deepseek-flash, proposer: deepseek-flash, harness: evolve}

# ============ memory（MOD-05 反思记忆库）============
memory:
  enabled: true
  store_format: jsonl
  max_entries: 2000
  ttl_ticks: 300
  min_age_ticks: 30
  compact_every: 200
  extract:
    max_candidates_per_reflection: 3
    use_llm: false
  dedup:
    sim_threshold: 0.85
    jaccard_weight: 0.5
    char3_weight: 0.5
  conflict:
    auto_supersede: false
    min_refs: 5
    winrate_delta: 0.15
  retrieve:
    top_k: 8
    token_budget: 900
    min_score: 0.15
    same_situation_bonus: 0.25
    weights: {tag: 1.0, bm25: 0.6, vector: 0.0, utility: 0.3, recency: 0.1}
    bm25: {k1: 1.2, b: 0.75}
    recency_lambda: 0.01
  embedding:
    enabled: false
    model: bge-small-zh-v1.5
    dim: 512
  snapshot:
    every_generation: true
  scan:
    on_write: true

# ============ loop（MOD-06 闭环编排）============
loop:
  k: 30 # 每 K 局训练触发一次演化周期
  max_generations: 3
  action_retry_r: 2
  hitl: false
  reflect_enabled: true
  reflect_timeout_s: 60.0
  reflect_context_window: 5
  train_concurrency: 1 # 固定 1（共享记忆写入）
  eval_concurrency: 2
  max_candidates_per_generation: 3 # 硬上限 3
  eval_seeds_per_candidate: 40
  # 2026-10-06（M2 开工 D-1 裁决）：170 → 120。按 C=1/S=2/H=40 实测单价 19.6 min/局，
  # E_gen = K + (1+C)(S+H) = 30 + 2×42 = 114 局 ≤ 120，≈37 h/代（按上限 120 算是 ≈39 h）。
  # H=40 是用满本上限的最大值：H=50 → E_gen=134 > 120（且 +20 局 = +6.5 h，不是 +3.3 h——
  # H 被 (1+C) 支臂各花一次）。改动本值必须同步重算 Spec §8.6 的成本条目。
  max_episodes_per_generation: 120 # 全系统唯一成本上限（E_gen 比较）
  n_candidates: 1 # 2026-10-06 D-1：2 → 1（多候选择优的削弱由 §3.2 冒烟确认）
  smoke_n: 2 # 2026-10-06 D-1：5 → 2。**必须与 evolve.smoke_n 同步改**（config.py 不做该校验）
  heldout_n: 40 # 2026-10-06 D-3：保持 40（H1 篮子 731000–731039，F45-2 六位端口空间；与 eval.n_heldout 必须相等）
  io_retry: 3
  io_backoff_ms: 200
  llm_timeout_s: 90.0
  fallback_on_llm_failure: true
  state_fsync: true
  retry_reflections_on_resume: false
  max_run_bytes: 2147483648 # 2 GB

# ============ evolve（MOD-07 harness 自进化）============
evolve:
  n_candidates: 1 # 2026-10-06 D-1：2 → 1（必须 == loop.n_candidates，config.py:558 已校验）
  n_traj: 20
  memory_top_k: 12
  max_diff_lines: 40
  max_diff_chars: 4000
  smoke_n: 2 # 2026-10-06 D-1：5 → 2。**必须与 loop.smoke_n 同步改**（无自动校验）
  min_heldout_n: 20
  # 2026-10-06 D-3：0.0 → 0.05。win_rate 在 n=40 上的粒度是 1/40 = 0.025，tol < 0.025
  # 等于「候选比 parent 少赢 1 局即被 C1 拒」，会拒掉约一半真正等价的候选。
  win_rate_tol: 0.05
  alpha: 0.05
  # 2026-10-06 D-3：保持 0.15（H 未变故不随 H 重标定）。M2 §3.2 冒烟产出第一批
  # train/heldout 配对后，再按实测 win_rate_gap 分布决定是否重标。
  gap_threshold: 0.15
  min_entropy_slope: -0.01
  # 2026-10-07（M2 开工检查单 §3.1 实测标定，裁决 A+C）：C5 三阈值 0.05/0.10/0.05 → 0.35/0.25/0.15。
  # 依据：full PolicyAgent 在 H1 子集（**旧四位协议** seed 2000–2009，n=10，eval 模式）实测
  #   illegal_rate 0.3016 / fallback_rate 0.2146 / truncation_rate 0.10，
  # 与 fixed_prompt 基线（0.3021 / 0.1810 / 0.0）同量级 → 原阈值分别超限 6.0× / 2.15× / 2.0×，
  # 会使 MOD-07 的每一次演化都被 C5 reject（闭环形式上跑通、实则 0 候选留下）。
  # 新值是「按实测上界 + 余量」的**先松开**口径：0.3016→0.35、0.2146→0.25、0.10→0.15。
  # ⚠️ 副作用：C5 由此变成非约束门（任何候选都能过），诊断价值临时让位于 M2 的
  #   「闭环跑通 ≥1 轮可判定演化」判据。M3 收紧路径见 Spec §8.6 / MOD-07 PRD §8.2：
  #   改为相对门 `candidate ≤ parent + tol`（登记 Spec B-41），tol 待 §3.2 冒烟产出
  #   第一批 train/heldout 配对后标定。
  # 实测证据：runs/m2-s31-full-baseline/（generations.csv + gen-000/report.json），
  #   记录见 docs/reviews/2026-10-07-M2-S31-full-agent基线实测.md。
  # 注（F45-2，2026-10-11）：H1 已移到六位端口空间（731000–731039）；上述 2000–2009 的实测
  #   证据属**旧四位协议**，与新协议不可比（见 configs/seeds.yaml 的代价说明）。
  max_illegal_rate: 0.35
  max_fallback_rate: 0.25
  # 2026-10-09（Spec v2.0 B-44，用户裁决 ②+③）：C5 由「三项绝对门」改为
  #   「illegal / fallback 绝对门 + truncation **相对门**」。
  # 原 max_truncation_rate: 0.15 已**删除**：它按本地 8B（实测 truncation_rate 0.10）标定，
  #   换成 DeepSeek 臂（M2 主力臂 C1）后 hard×6 实测 **0.30 > 0.15**，会 reject 每一个候选，
  #   把闭环**静默锁死**（缺陷 F28，见 docs/tasks/2026-10-06-M2开工检查单.md §8.2）。
  # 为什么只有 truncation 改相对门：truncation_rate 是「局型 × 策略强度」的合成属性
  #   （同一 run 内 heuristic 0.00、DeepSeek hard×6 0.30、8B hard×6 0.10），
  #   不像 illegal/fallback 那样有跨臂的绝对意义。
  # tol = 0.05 的 n=40 口径：heldout 粒度 1/40 = 0.025，0.05 = 容忍 2 局的噪声，
  #   与 evolve.win_rate_tol 同一依据（D-3）。
  truncation_tol: 0.05
  # 2026-10-11（D-M3-2 裁决 E，用户）：C5 三轴统一为「相对门 + 绝对 backstop」。
  # 现场：`max_illegal_rate` / `max_fallback_rate` 的绝对门（0.35 / 0.25）对 `C1` 实测值
  #   （0.0318 / 0.0017）松 **11× / 147×** ⇒ 实际非约束（与上方「先松开」同一状态）。
  #   后果：「候选把非法率推高」的退化候选被放行，**判据 2 的归因结论不成立**。
  # 判定式：`candidate ≤ min(parent + <axis>_tol, <axis>_backstop)`（truncation 同构）。
  #   rel 抓「相对退化」；backstop 抓「parent 本身已经很烂时跟着烂」（§8.2.2 的已知放宽：
  #   parent=0.90 时候选 0.60 也过）。
  # `tol = 0.05` 按轴分列、**不可互换**：illegal（步级，分母≈12k 尝试）/ fallback（步级，
  #   分母≈3.7k 决策）的 0.05 远大于同臂批内噪声（se≈0.0017 / 0.0030）⇒ 防「真·退化」，
  #   不承担「检微小漂移」；truncation 是**局级**（1/40 = 0.025）⇒ 0.05 = 2 局噪声。
  # ⚠️ 诚实边界：§3.2「按同代内抖动标定」**未做**（需配对实测，未付费）⇒ 0.05 是起点值，
  #   不是实测标定值。
  illegal_tol: 0.05
  fallback_tol: 0.05
  # truncation 的绝对 backstop（只堵相对门的已知放宽，不替代相对门）。
  truncation_backstop: 0.60
  # 2026-10-11（F54，彩排事故的处置）：**held-out 篮子可配置**，默认仍是 H1。
  # 现场：`evolve/judge.py` 的 `HOLDOUT_BASKET = "H1"` 与 `loop/generation.py`
  #   `write_gen000_baseline(basket="H1")` 是**两处写死的默认值**，且没有任何配置项可改
  #   ⇒ `scripts/run_m3_rehearsal.sh`（声明只用 H3 731080–731099）实测**跑在 H1 上**
  #   （已落盘 `e-731000…731004-g000-parent.jsonl`，≈¥5.1 API + 5 个一次性 seed）。
  # 口径：本键同时决定 **gen-000 基线**与**候选 arm 的 held-out 评估**用哪个篮子
  #   ——两者必须同源，否则 `parent` 与 `candidate` 的对比跨越两套 seed（C0 的
  #   「同预算」前提直接失效）。默认 `H1`（`generation_judge`）**不变**；只有
  #   「不参与 M3 判据」的彩排/干跑才该改成 `H3`（`reserve`，可重复用，见 D-M3-5）。
  # ⚠️ 属于 `config_hash` 的一部分：改成 H3 即换 run-id 族，**不得**在正式实验 run 上改。
  heldout_basket: H1
  hitl: true
  gate_timeout_hours: 24
  propose_max_retries: 2
  evolvable_keys: [retrieval.top_k, sampling.temperature, prompt.show_intent]
  tool_import_allowlist: [math, re, json, itertools, functools, typing, dataclasses]

# ============ eval（MOD-08 测量）============
eval:
  n_heldout: 40 # H1
  n_test: 100
  n_ablation: 40 # H2
  bootstrap_B: 10000
  alpha: 0.05
  fdr_q: 0.10
  gap_threshold: 0.15
  t_max: 120
  n_workers: 2 # F42-C：MOD-06 基线路径与 MOD-07 `evolve/judge.py` 的候选臂评估**都**显式转发
  #   本值与 `determinism.n_rep`；修复前候选臂路径没传，落到 `evaluate_arm` 的默认 n_workers=1
  #   （一代 84 局串行）。本地臂并发提速 ≈2×；**API 臂未实测**。
  # 2026-10-04（M1 实测回填）：原 300 s 是按「t_d ≈ 3 s × 决策点 96」定的（≈288 s，本就贴边）；
  #（F20 已于 2026-10-05 修复：该预算现在真的被执行——SandboxRunner 的 deadline +
  #  run_eval 的硬看门狗，超时记 dropped + E_EVAL_TIMEOUT，计 n 按 lose 计。）
  # 真实 8B 实测 t_d p50 = 5.69 s → 单局 ≈546 s，含重试与晚局长决策可到 ~950 s。
  # 取 1800 s ≈ 实测单局的 2 倍余量（依据见 M1 验收报告 §12）。
  # 2026-10-05（M1 验收 F24）：本值是**墙钟**预算（SandboxRunner 的 deadline 与 run_eval 的
  # 硬看门狗都按它计时），而 n_workers 个局共享同一个模型实例（max_inflight=1），所以
  #   单局墙钟 ≈ D × 每决策调用数 × t_d × n_workers
  # 实测（`runs/m1-real-h1n40e/`，fixed_prompt，8B+MLX，n_workers=2）：D ≈ 185–207 决策点、
  # 调用/决策点 ≈ 1.6–1.8、t_d p50 ≈ 7.9 s / p95 ≈ 10.8 s（实际 prompt 2500–3000 token）→
  # 单局 ≈ 43 分钟模型时间、墙钟 ≈ 90 分钟。故按「最坏 300 决策点 × 1.8 调用 × 12 s × 2 worker
  # ≈ 13000 s」取 14400 s（4 h）。原值 1800 s / 5400 s 分别把两批 n=40 判成 dropped。
  seed_timeout_s: 14400
  min_support: 3
  drop_rate_max: 0.10
  budget_seconds: null
  entropy: {base: 2.0, kind_space: 16}
  collapse:
    c1_slope_threshold: -0.010
    c2_ratio_threshold: 0.60
    c3_jsd_freeze: 0.010
    c3_winrate_jump: 0.05
    c4_seq_ratio: 0.50
    confirm_generations: 2
  determinism:
    eval_temperature: 0.0 # Spec §8.1 B-14：固定值，不可配置为其他值
    train_temperature: 0.7
    n_rep: 1
    n_rep_nondeterministic: 3
    decode_seed: 0
  baseline:
    kinds: [random, heuristic, fixed_prompt]
    archive_dir: baselines
    fixed_prompt_harness_version: 0
  ablation:
    arms: [full, no_reflection, no_self_edit]
    split_basket: H2

# ============ infra（MOD-09 本模块）============
infra:
  runs_root: runs # 不参与 config_hash
  log_level: INFO # 不参与 config_hash
  fsync_every: 0 # 0 = 不 fsync；长跑建议 200
  rotate_max_mb: 512
  threads: 1 # 传给推理后端与 numpy（确定性）
  utc: true
  redaction_enabled: true
  plot_enabled: true
  git_enabled: true
  exit_on_guard: true

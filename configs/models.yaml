# configs/models.yaml —— MOD-03 推理后端注册表（PRD §7；schema 见 schemas/models.schema.json）
#
# 静态注册表（NFR-03-04）：M1–M3 不参与 harness 演化，只允许人工变更并记 CHANGELOG。
# model_id 为全系统引用键；weights_sha256 缺失（null）时跳过校验，CI 要求 M1 结束前填写（Q-6）。
# 落盘用块式 YAML；PRD §7 的 flow-style 仅为文档紧凑。
#
# 内存预算公式（PRD §7）：
#   required_gb = resident_gb_est + kv_gb_per_1k_tokens × (context_length/1000) × max_inflight + 1.0
#   required_gb > ram_budget_gb → 在 acquire 前拒绝并抛 E_LLM_OOM（零提交，FR-03-08）。

registry_version: 1
ram_budget_gb: 20.0 # 24GB 硬上限留 4GB 给 Python/环境/OS（NFR-03-03）
fallback_backend: mock # 加载失败换后端重试 1 次的目标（PRD §10）

defaults:
  context_length: 8192
  kv_cache_bits: 8
  max_inflight: 1
  quantization: 4bit
  supports_grammar: false
  supports_json_mode: true
  kv_gb_per_1k_tokens: 0.15
  perf_budget: { p50_latency_ms: 1500, p95_latency_ms: 3000, min_tok_per_s: 25 }

models:
  # 阶段一（M1）主力：MLX 进程内 + JSON mode（无 GBNF，见 PRD §6 差异表）
  #
  # 2026-10-04 实测回填（run `m1-real-bench2` / `m1-real-rob`，Apple Silicon，mlx 0.32.3 + mlx-lm 0.32.0）：
  #   resident_gb_measured = 4.6077 GB（mx.get_active_memory，n=30）；预算 4.6077+0.15×8.192+1.0 = 6.84 ≤ 20 ✅
  #   延迟（probe prompt，n=30）：p50 4043.5 ms / p95 4199.0 ms / 12.42 tok/s
  #   延迟（真实 MOD-04 prompt，robustness n=200）：p50 5687.0 ms / p95 11703.3 ms / 12.02 tok/s
  #   ⚠️ 原预算 p50 1500 / p95 3000 / 25 tok/s **未达成**（p50 差 2.7×，tok/s 差 2.0×）；
  #      新预算按实测 + 适度余量重设，仅用于捕捉后续回归，不代表原始目标已满足。
  qwen3-8b-q4:
    backend: mlx
    weights_path: models/Qwen3-8B-4bit
    tokenizer_path: models/Qwen3-8B-4bit
    quantization: 4bit
    context_length: 8192
    kv_cache_bits: 8
    resident_gb_est: 4.6077 # 实测（NFR-03-03）；原估 5.6 偏保守
    kv_gb_per_1k_tokens: 0.15
    max_inflight: 1
    supports_grammar: false
    supports_json_mode: true
    fallback_backend: llama_cpp
    # Q-6 已关闭：目录级 sha256（隐性 `.*` 目录已排除，见 MOD-03 `weights_digest` 的 F17 修复）
    weights_sha256: 20303070eb19e8a47a04f828d9239e9c1697392f183408535b5ab51fe9fe4b49
    default_sampling: { temperature: 0.7, top_p: 0.95, top_k: 0, repetition_penalty: 1.05 }
    perf_budget: { p50_latency_ms: 5000, p95_latency_ms: 6000, min_tok_per_s: 10 }
    family: qwen3
    params_b: 8.0
    notes: 阶段一主力后端（MLX）；必须关思考模式（enable_thinking=false，见 MOD-03 §10②）

  # 阶段二：30B-A3B GGUF + llama-server（GBNF 稳定、可 --parallel）
  # 已裁决（Spec v1.3 P-10 → §8.6）：默认 context_length=8192, max_inflight=1，
  # 「评估并发」靠局级并发（loop.eval_concurrency=2，共享串行推理队列）而非模型级批处理。
  # 预算（PRD §7 公式）：18.8 + 0.05×8.192×1 + 1.0 = 20.21 > 20.0 —— **临界超限**。
  # 阶段二启用前必须三选一：①inference bench 实测回填 resident_gb_est（Q-2）；
  # ②kv_cache_bits=4 后重跑 format_robustness 对比（Q-4）；③调高 ram_budget_gb（需实测）。
  qwen3-30b-a3b-q4:
    backend: llama_server
    weights_path: models/Qwen3-30B-A3B-Q4_K_M.gguf
    quantization: q4_k_m
    context_length: 8192
    kv_cache_bits: 8 # kv_cache_bits=4 可救预算（Q-4）
    resident_gb_est: 18.8
    kv_gb_per_1k_tokens: 0.05
    max_inflight: 1
    supports_grammar: true
    supports_json_mode: true
    weights_sha256: null
    server_args: ["--parallel", "1", "--host", "127.0.0.1"] # port 由 manager 分配
    default_sampling: { temperature: 0.7, top_p: 0.95, top_k: 0, repetition_penalty: 1.05 }
    perf_budget: { p95_latency_ms: 8000, min_tok_per_s: 12 }
    family: qwen3-moe
    params_b: 30.0
    notes: 阶段二后端

  # 离线冒烟/单测用的确定性假后端（无权重、零依赖）
  mock:
    backend: mock
    weights_path: null
    quantization: none
    context_length: 4096
    kv_cache_bits: 8
    resident_gb_est: 0.0
    kv_gb_per_1k_tokens: 0.0
    max_inflight: 1
    supports_grammar: true
    supports_json_mode: true
    weights_sha256: null
    default_sampling: { temperature: 0.0, top_p: 1.0, top_k: 0, repetition_penalty: 1.0 }
    perf_budget: { p50_latency_ms: 50, p95_latency_ms: 200, min_tok_per_s: 1 }
    family: mock
    params_b: 0.0
    notes: 冒烟与单测用的确定性假后端

  # Issue #1：外部 proposer / 全量对照臂（B0/B1/C0/C1）用的 DeepSeek API 模型。
  # - provider=api + online=true：run provenance 必须如实记为在线调用，不许记成本地；
  # - api_key_env 只登记**变量名**，key 本体绝不进 harness/、run JSON、Git 或 prompt
  #   （真跑时 key 放本地 .env 或环境变量，见 inference/secrets.py）；
  # - api_supports_seed=false：DeepSeek 不承诺跨时间严格确定性，因此 sampling 照记、
  #   响应按 request hash 归档并比对 response hash（变化即标记 llm.nondeterministic）；
  # - 单价只用于报告里的成本估算，不参与任何判定；未登记就记 null（不拿 0 冒充免费）。
  # 离线单测/CI 用 mock transport 或 api_mode=replay，不触网（见 MOD-03 deepseek_backend.py）。
  #
  # 2026-10-08 实测（`GET https://api.deepseek.com/v1/models`，真 key）：本账号/接口版本
  # **只有** deepseek-flash 与 deepseek-v4-pro 两个模型 —— 原登记的 `deepseek-chat`
  # 已不在列表内（旧名 `deepseek-v4-flash` 也仍可调用但已下线、由 V4.1-Flash 提供服务）。
  # 因此六臂的 B/C 臂一律使用 **deepseek-flash**。
  deepseek-flash:
    backend: deepseek
    provider: api
    online: true
    weights_path: null
    quantization: none
    context_length: 1048576 # 实测：context_window = 1,048,576（1M）
    kv_cache_bits: 8
    resident_gb_est: 0.0 # 不占本地内存
    kv_gb_per_1k_tokens: 0.0
    max_inflight: 2 # 评估模式下 BackendManager 仍强制 1
    supports_grammar: false # 无 GBNF；走 response_format=json_object + jsonschema 校验
    supports_json_mode: true # 官方文档：Json Output 支持
    weights_sha256: null
    api_base: https://api.deepseek.com/v1
    api_model: deepseek-flash
    api_key_env: DEEPSEEK_API_KEY
    api_supports_seed: false
    # 2026-10-08 实测（真 key probe）：flash **默认开启思考模式**，思维链会吃掉 max_tokens，
    # 导致 content 返回空串 → 每次都靠 MOD-03 的修复重试才拿到 JSON（白花一次调用）。
    # 结构化 JSON 决策/提案流水线因此显式关闭思考模式；官方文档：思考模式不支持
    # temperature（被忽略），非思考模式下 temperature 生效 —— 正是 B-14 需要的确定性口径。
    api_thinking: disabled
    # 实测：模型名 DeepSeek-V4.1-Flash；响应里的 model 字段会覆盖为实际 revision
    model_revision: DeepSeek-V4.1-Flash
    # 官方定价（人民币 / 百万 tokens，2026-10-08 取自 api-docs.deepseek.com/zh-cn/quick_start/pricing）：
    #   输入(缓存未命中) 空闲 ¥1 / 高峰 ¥2；输出 空闲 ¥4 / 高峰 ¥8。
    # 这里登记**高峰档**（最坏上界）；空闲档是它的一半。换算成 1k tokens 单价如下。
    cost_per_1k_input: 0.002
    cost_per_1k_output: 0.008
    cost_currency: CNY
    cost_basis: peak # 高峰时段上界（北京时间工作日 9:00-12:00 / 14:00-18:00）
    default_sampling: { temperature: 0.0, top_p: 1.0, top_k: 0, repetition_penalty: 1.0 }
    perf_budget: { p50_latency_ms: 3000, p95_latency_ms: 12000, min_tok_per_s: 8 }
    family: deepseek
    params_b: 0.0
    notes: 外部 proposer / 全量对照（Issue #1 臂 B0/B1/C0/C1）；需要 DEEPSEEK_API_KEY，Qwen 主线不依赖它

  # 同账号可用的另一个（更强、更贵）模型：登记但**当前不被任何臂使用**，
  # 供后续「proposer 能力 vs 成本」对照（Issue #1 任务 7 的 capability gate）直接切。
  # 官方定价（人民币 / 百万 tokens，高峰档）：输入(缓存未命中) ¥9 / 输出 ¥27；空闲减半。
  deepseek-v4-pro:
    backend: deepseek
    provider: api
    online: true
    weights_path: null
    quantization: none
    context_length: 1048576
    kv_cache_bits: 8
    resident_gb_est: 0.0
    kv_gb_per_1k_tokens: 0.0
    max_inflight: 2
    supports_grammar: false
    supports_json_mode: true
    weights_sha256: null
    api_base: https://api.deepseek.com/v1
    api_model: deepseek-v4-pro
    api_key_env: DEEPSEEK_API_KEY
    api_supports_seed: false
    api_thinking: disabled
    model_revision: DeepSeek-V4-Pro-0813
    cost_per_1k_input: 0.009
    cost_per_1k_output: 0.027
    cost_currency: CNY
    cost_basis: peak
    default_sampling: { temperature: 0.0, top_p: 1.0, top_k: 0, repetition_penalty: 1.0 }
    perf_budget: { p50_latency_ms: 5000, p95_latency_ms: 20000, min_tok_per_s: 6 }
    family: deepseek
    params_b: 0.0
    notes: 更强的 DeepSeek 对照模型（当前未被任何臂使用）；切法：experiment.roles/arms 里写 deepseek-v4-pro

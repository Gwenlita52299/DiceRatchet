# configs/seeds.yaml —— seed 三方隔离协议（MOD-08 §9 定义；加载与区间校验归 MOD-09）
# INV-5：train / heldout / test 的 seed 三方隔离，任一重叠 → E_EVAL_SEED_OVERLAP
version: 1
hash_algo: sha256

splits:
  train:
    start: 1000
    end: 1999
    per_generation: 30
    consume: in_order
    expose_to: [prompt, memory, reflection] # 训练 seed 可见于 agent
  heldout:
    expose_to: [] # heldout seed 不得出现在任何 agent 可见出口
    # F45-2（2026-10-11）：heldout/test 全部移到**六位**端口空间。
    # 理由：原先四位（2000–2099 / 9000–9099）与耗时（`duration_us=2072.8`）、
    # token 预算（`max_tokens=2048`）、ISO 年份（`2026`）、秒级浮点（`dur_s=3.9022`）
    # 共用一个数字空间 ⇒「数字串相等即泄漏」这条规则**不健全**，只能靠两张人工死名单
    # 豁免，实测 12 个键撞上、总命中 118,646 次（其中 `ts` 的年份 2026 占 94%）。
    # 六位区间（731xxx / 947xxx）避开常见预算/时长/日历字面量，正则 `[0-9]{3,6}` 无需放宽。
    # ⚠️ 代价：已归档的 v2 证据（旧四位区间）与新协议**不可比**，见 MOD-08 PRD §4/§9。
    baskets:
      H1: {start: 731000, end: 731039, role: generation_judge} # 代际裁判
      H2: {start: 731040, end: 731079, role: ablation_final}   # 消融
      H3: {start: 731080, end: 731099, role: reserve}          # 预留
  test:
    start: 947000
    end: 947099
    role: final_acceptance
    locked: true
    unlock_policy: single_use_per_milestone

exposure_guard:
  destinations_forbidden: [prompt, memory, reflection]
  numeric_scan: true # 文本中 3–6 位数字 token 落 731000-731099 / 947000-947099 即告警
  forbidden_tokens: [heldout, H1, H2, H3, "731000-731099", "947000-947099"]

# 由 CLI 生成、CI 校验；改动必须同步更新并在 PR 说明
# 生成/校验命令：python -m dice_ratchet eval diversity（协议校验）或
#   python -c "from dice_ratchet.evals.seeds import load_protocol, protocol_hash; print(protocol_hash(load_protocol('configs')))"
seeds_hash: "sha256:686b2618330db5eb8291c1810499dc07fc47a956da5711803015bbb09ec2e904"
